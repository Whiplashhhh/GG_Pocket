# Local machine and deployed dev environment. Local defaults match deploy/compose.local.yml;
# the deployed dev overrides them with GG_DB_URL / GG_DB_USER / GG_DB_PASSWORD.
spring:
  datasource:
    url: ${GG_DB_URL:jdbc:postgresql://localhost:5432/ggpocket}
    username: ${GG_DB_USER:ggpocket}
    password: ${GG_DB_PASSWORD:ggpocket}

# Demo accounts (spec §17): only with GG_ALLOW_DEMO_SEED=true, see DemoSeeder for the other safety catches.
gg:
  demo-seed:
    allowed: ${GG_ALLOW_DEMO_SEED:false}
    password: ${GG_SEED_PASSWORD:}
