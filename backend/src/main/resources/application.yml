# Shared configuration. Environment-specific values live in application-dev.yml / application-prod.yml.
# App settings (prefix "gg") come from environment variables: GG_ENVIRONMENT, GG_GIT_COMMIT, GG_GIT_BRANCH.
spring:
  application:
    name: gg-pocket-api
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  writer-with-order-by-keys: true
