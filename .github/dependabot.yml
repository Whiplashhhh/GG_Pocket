# Weekly dependency updates, grouped so the club's volunteers review a handful of PRs, not dozens.
# Security updates are opened as soon as an advisory is published, whatever the schedule.
version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      spring:
        patterns: ["org.springframework*", "io.spring*"]
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    ignore:
      # Follows the Node LTS of the project (24, see .nvmrc), not the latest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      vue:
        patterns: ["vue", "vue-*", "@vue/*", "pinia", "@tanstack/*"]
      tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    ignore:
      # LTS lines chosen in the spec (§4): moving Node, Java or PostgreSQL is a decision, not a bump.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(docker)"
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    ignore:
      # A PostgreSQL major version needs a dump and restore of the data, never an automatic bump.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(docker)"
    groups:
      compose-images:
        patterns: ["*"]
