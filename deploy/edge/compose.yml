# Edge proxy, one per server (DECISIONS D-060). Lives in /opt/gg-pocket/edge with its .env:
#   GG_PROD_DOMAIN and GG_DEV_DOMAIN (see deploy/env/edge.env.example).
name: gg-pocket-edge

services:
  caddy:
    # The stock image for local checks; a release points it at its own web image, whose Caddy is
    # rebuilt with a fixed Go and scanned (scripts/pin-edge-image.sh, D-112).
    image: caddy:2.11-alpine
    # Root without any capability but binding 80 and 443: the rebuilt binary carries no file
    # capability, so a non-root user could not bind them.
    user: "0:0"
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dev.d:/etc/caddy/dev.d:ro
      # nocopy: a new volume stays root's, not the web image's user (10001), whose /data and
      # /config root without DAC_OVERRIDE could not write (D-112).
      - { type: volume, source: caddy-data, target: /data, volume: { nocopy: true } }
      - { type: volume, source: caddy-config, target: /config, volume: { nocopy: true } }
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8079/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

volumes:
  caddy-data:
  caddy-config:
