# Local development only: the database the backend connects to (see README, "Démarrer en local").
# Credentials are local-only defaults, mirrored in backend/src/main/resources/application-dev.yml.
name: gg-pocket-local

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ggpocket
      POSTGRES_USER: ggpocket
      POSTGRES_PASSWORD: ggpocket
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ggpocket -d ggpocket"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
